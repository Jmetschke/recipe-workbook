<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- PWA/mobile viewport uses viewport-fit so installed iPhone apps can respect the safe area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#246b8f">
    <meta name="application-name" content="Recipe Manager">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- iOS Safari uses these tags for Add to Home Screen standalone behavior and icon selection. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Recipe Manager">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Recipe Manager</title>
    <!-- PWA manifest and Apple icon make the internal app installable from mobile browsers. -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">Recipe Manager</div>
      <button class="nav active" data-view="dashboard">Dashboard</button>
      <button class="nav" data-view="import">Import</button>
      <button class="nav" data-view="drafts">Draft Recipes</button>
      <button class="nav" data-view="cards">Published Cards</button>
      <button class="nav" data-view="archived">Archived</button>
      <button class="nav" data-view="ingredients">Ingredients</button>
      <button class="nav" data-view="productionItems">Production Items</button>
      <button class="nav" data-view="settings">Settings</button>
      <div class="external-nav-group" aria-label="External web pages">
        <div class="external-nav-label">External Web Pages</div>
        <a class="external-nav" href="https://manufacturing-tracker.onrender.com" target="_blank" rel="noopener noreferrer">Time Tracker ↗</a>
        <a class="external-nav" href="https://ingredient-projection-workbook.onrender.com" target="_blank" rel="noopener noreferrer">Ingredient Workbook ↗</a>
      </div>
    </aside>
    <main class="app">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Recipes, drafts, published cards, and import tools.</p>
        </div>
        <div class="top-actions">
          <div class="tracker-nav" aria-label="Manufacturing tracker navigation">
            <div class="tracker-toggle" role="group" aria-label="Choose manufacturing tracker location">
              <label>
                <input type="radio" name="trackerLocation" value="IL" checked>
                <span>IL</span>
              </label>
              <label>
                <input type="radio" name="trackerLocation" value="NY">
                <span>NY</span>
              </label>
            </div>
            <button id="trackerNavBtn" type="button">Open Tracker</button>
          </div>
          <button id="newRecipeBtn" class="primary">New Recipe</button>
          <button id="importShortcutBtn">Import Spreadsheet</button>
        </div>
      </header>
      <section id="toast" class="toast hidden"></section>
      <section id="content"></section>
    </main>

    <template id="recipeRowTemplate">
      <tr>
        <td data-mobile-label="Type">
          <select data-field="ingredient_type">
            <option value=""></option>
            <option value="SB">SB</option>
            <option value="Hijnx">Hijnx</option>
            <option value="Hijnx/Topicals">Hijnx/Topicals</option>
            <option value="Topicals">Topicals</option>
          </select>
        </td>
        <td data-mobile-label="Name"><select data-field="ingredient_name"></select></td>
        <td data-mobile-label="Formula qty"><input type="number" step="any" data-field="formula_qty"></td>
        <td data-mobile-label="Formula %"><input type="number" step="any" data-field="formula_percent"></td>
        <td data-mobile-label="Unit"><input data-field="unit"></td>
        <td data-mobile-label="Vendor"><input data-field="vendor"></td>
        <td data-mobile-label="Notes"><input data-field="notes"></td>
        <td data-mobile-label="Batch qty to use"><input type="number" step="any" data-field="batch_qty" class="batch-qty-field calculated" readonly></td>
        <td data-mobile-label="Actions"><button class="icon danger" data-action="removeIngredient">×</button></td>
      </tr>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
