<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- PWA/mobile viewport uses viewport-fit so installed iPhone apps can respect the safe area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#246b8f">
    <meta name="application-name" content="Recipe Manager">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- iOS Safari uses these tags for Add to Home Screen standalone behavior and icon selection. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Recipe Manager">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Recipe Manager</title>
    <!-- PWA manifest and Apple icon make the internal app installable from mobile browsers. -->
    <link rel="manifest" href="/manifest.json">
    <!-- iOS uses this explicit PNG for the Home Screen icon. -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <nav class="location-nav" aria-label="Company tools">
      <div class="location-nav__toggle" role="group" aria-label="Choose location">
        <button class="location-nav__toggle-button active" type="button" data-location="IL" aria-pressed="true">IL</button>
        <button class="location-nav__toggle-button" type="button" data-location="NY" aria-pressed="false">NY</button>
      </div>
      <div class="location-nav__links" data-location-links="IL" aria-label="Illinois tools">
        <a href="https://manufacturing-tracker.onrender.com">Production Tracker IL</a>
        <a href="https://velocity-tracker-zc5x.onrender.com">Velocity Tracker IL</a>
        <a href="https://recipe-workbook.onrender.com">Recipe Tracker IL</a>
        <a href="https://ingredient-projection-workbook.onrender.com">Ingredient Tracker IL</a>
      </div>
      <div class="location-nav__links" data-location-links="NY" aria-label="New York tools" hidden>
        <a href="https://manufacturing-tracker-ny.onrender.com">Production Tracker NY</a>
        <a href="https://ingredient-projection-workbook-ny.onrender.com">Ingredient Tracker NY</a>
        <a href="https://velocity-tracker-ny.onrender.com">Velocity Tracker NY</a>
        <a href="https://recipe-workbook-ny.onrender.com">Recipe Tracker NY</a>
      </div>
    </nav>
    <aside class="sidebar">
      <div class="brand">Recipe Manager</div>
      <button class="nav active" data-view="dashboard">Dashboard</button>
      <button class="nav" data-view="import">Import</button>
      <button class="nav" data-view="drafts">Draft Recipes</button>
      <button class="nav" data-view="cards">Published Cards</button>
      <button class="nav" data-view="archived">Archived</button>
      <button class="nav" data-view="ingredients">Ingredients</button>
      <button class="nav" data-view="productionItems">Production Items</button>
      <button class="nav" data-view="settings">Settings</button>
    </aside>
    <main class="app">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Recipes, drafts, published cards, and import tools.</p>
        </div>
        <div class="top-actions">
          <!-- PWA install help remains visible in browsers and changes to Downloaded in standalone mode. -->
          <button id="pwaInstallHelp" class="install-button" type="button" aria-haspopup="dialog">
            <svg class="install-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v4h14v-4" />
            </svg>
            <span id="pwaInstallLabel">Download</span>
          </button>
          <button id="newRecipeBtn" class="primary">New Recipe</button>
          <button id="importShortcutBtn">Import Spreadsheet</button>
        </div>
      </header>
      <section id="toast" class="toast hidden"></section>
      <section id="content"></section>
    </main>

    <!-- Installation guidance is platform-aware; live recipe data is never placed in this dialog or cached. -->
    <div id="pwaInstallDialog" class="install-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="pwaInstallTitle">
      <div class="install-dialog-card">
        <div class="section-header">
          <div>
            <h2 id="pwaInstallTitle">Download Recipe Manager</h2>
            <p id="pwaInstallStatus" class="helper"></p>
          </div>
          <button id="closePwaInstallDialog" type="button" aria-label="Close download instructions">×</button>
        </div>
        <div id="pwaInstallInstructions"></div>
        <div class="toolbar">
          <button id="runPwaInstall" class="primary hidden" type="button">Install App</button>
          <button id="donePwaInstall" type="button">Done</button>
        </div>
      </div>
    </div>

    <template id="recipeRowTemplate">
      <tr>
        <td data-mobile-label="Type">
          <select data-field="ingredient_type">
            <option value=""></option>
            <option value="SB">SB</option>
            <option value="Hijnx">Hijnx</option>
            <option value="Hijnx/Topicals">Hijnx/Topicals</option>
            <option value="Topicals">Topicals</option>
          </select>
        </td>
        <td data-mobile-label="Name"><select data-field="ingredient_name"></select></td>
        <td data-mobile-label="Formula qty"><input type="number" step="any" data-field="formula_qty"></td>
        <td data-mobile-label="Formula %"><input type="number" step="any" data-field="formula_percent"></td>
        <td data-mobile-label="Unit"><input data-field="unit"></td>
        <td data-mobile-label="Vendor"><input data-field="vendor"></td>
        <td data-mobile-label="Notes"><input data-field="notes"></td>
        <td data-mobile-label="Batch qty to use"><input type="number" step="any" data-field="batch_qty" class="batch-qty-field calculated" readonly></td>
        <td data-mobile-label="Actions"><button class="icon danger" data-action="removeIngredient">×</button></td>
      </tr>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
